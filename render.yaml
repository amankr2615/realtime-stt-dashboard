services:
  - type: web
    name: hinglish-stt-studio
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: hinglish-db
          property: connectionString
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: WHISPER_CPU_THREADS
        value: 2

databases:
  - name: hinglish-db
    plan: free
    region: oregon
